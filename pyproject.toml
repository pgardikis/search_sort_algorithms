[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "search-sort-algorithms"
version = "1.0.0"
description = "Merge sort, linear search, binary search and interpolation search implemented from scratch in Python."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
search-sort = "search_sort.cli:main"

[tool.setuptools]
packages = ["search_sort"]
