[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-sort-algorithms"
version = "1.0.0"
description = "Merge sort, quick sort, linear search, binary search and interpolation search implemented from scratch in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pgardikis" }]

[project.optional-dependencies]
test = ["pytest"]
ci = ["pytest-github-actions-annotate-failures"]

[project.scripts]
search-sort = "search_sort.cli:main"

[tool.setuptools]
packages = ["search_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
